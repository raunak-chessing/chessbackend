name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          # prisma.config.js resolves DATABASE_URL for every CLI command,
          # including generate, which never opens a connection — a
          # placeholder is enough to satisfy the config loader here.
          DATABASE_URL: postgresql://user:password@localhost:5432/db

      - name: Type-check and compile
        run: pnpm run build

      - name: Run unit tests
        run: pnpm exec jest --ci
